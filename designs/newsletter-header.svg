<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <title>Brew Haven Newsletter Header — Pumpkin Spice Latte</title>
  <desc>Email newsletter header banner for Brew Haven's October Pumpkin Spice Latte promotion with warm cozy aesthetic.</desc>
  <defs>
    <linearGradient id="o" x1="0" x2="1">
      <stop stop-color="#28140c" stop-opacity=".96"/>
      <stop offset=".65" stop-color="#28140c" stop-opacity=".67"/>
      <stop offset="1" stop-color="#28140c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <image href="../assets/pumpkin-latte-unsplash.jpg" x="0" y="-140" width="600" height="420" preserveAspectRatio="xMidYMid slice"/>
  <rect width="600" height="200" fill="url(#o)"/>
  <text x="35" y="46" fill="#f8dfbd" font-family="Georgia,serif" font-size="20" font-weight="bold" letter-spacing="3">BREW HAVEN</text>
  <text x="35" y="101" fill="#fff4df" font-family="Georgia,serif" font-size="37" font-weight="bold">October tastes cozy.</text>
  <text x="37" y="140" fill="#f8dfbd" font-family="Arial,sans-serif" font-size="17">Meet the Pumpkin Spice Latte.</text>
  <rect x="37" y="158" width="130" height="25" rx="12" fill="#e98136"/>
  <text x="53" y="176" fill="#2c180e" font-family="Arial,sans-serif" font-size="11" font-weight="bold">SIP THE SEASON</text>
</svg>
