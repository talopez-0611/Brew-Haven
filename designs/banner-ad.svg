<svg xmlns="http://www.w3.org/2000/svg" width="336" height="280" viewBox="0 0 336 280">
  <title>Brew Haven Banner Ad — Pumpkin Spice Latte</title>
  <desc>Small banner advertisement for Brew Haven's seasonal Pumpkin Spice Latte with warm autumn colors and call-to-action button.</desc>
  <defs>
    <linearGradient id="o" x1="0" x2="1">
      <stop stop-color="#28140c" stop-opacity=".96"/>
      <stop offset="1" stop-color="#28140c" stop-opacity=".17"/>
    </linearGradient>
  </defs>
  <image href="../assets/pumpkin-latte-unsplash.jpg" x="0" y="-55" width="336" height="430" preserveAspectRatio="xMidYMid slice"/>
  <rect width="336" height="280" fill="url(#o)"/>
  <text x="24" y="35" fill="#f9e4c6" font-family="Georgia,serif" font-size="14" font-weight="bold" letter-spacing="2">BREW HAVEN</text>
  <text x="24" y="98" fill="#fff4df" font-family="Georgia,serif" font-size="39" font-weight="bold">COZY</text>
  <text x="24" y="136" fill="#fff4df" font-family="Georgia,serif" font-size="39" font-weight="bold">IN A CUP.</text>
  <text x="24" y="166" fill="#f7d4aa" font-family="Arial,sans-serif" font-size="15">Pumpkin Spice Latte</text>
  <rect x="24" y="195" width="159" height="42" rx="21" fill="#e98136"/>
  <text x="103.5" y="221" text-anchor="middle" fill="#2b170d" font-family="Arial,sans-serif" font-size="13" font-weight="bold">TRY IT TODAY</text>
  <text x="24" y="264" fill="#fff0d8" font-family="Arial,sans-serif" font-size="10" letter-spacing="1">OCTOBER SPECIAL</text>
</svg>
